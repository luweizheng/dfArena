dataset_id: usaspending
version: '1.0'
domain: public_sector
source:
  benchmark: DataAgentBench
  dataset: query_usaspending
  adaptations:
  - The PostgreSQL literal TEXT INSERT snapshot was decoded without SQL execution or server restore; SQLite
    INTEGER remains int64 and DuckDB INTEGER remains int32.
  - contract_documents.descriptions is reversible JSON array text retaining original array and object-key
    order; no identifiers were generated.
  - Rows, duplicate entries, nulls, empty strings, prose amounts, date strings, and identifier variants
    were retained without fuzzy matching, normalization, amount inference, conflict filtering, aggregation,
    or answer computation during conversion.
  - Subsequent approved task clarifications changed hints and descriptions; source data, questions, and
    reference answers remain unchanged. Subsequent validator revisions accept sentence-final punctuation
    after integers and distinguish declared or bold agency answers from unrelated bold headings.
