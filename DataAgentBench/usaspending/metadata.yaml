  adaptations:
  - Literal TEXT-only PostgreSQL INSERT snapshot decoded without SQL execution or
    PostgreSQL server restore.
  - Descriptions BSON list of objects encoded as reversible JSON array text with original
    array and object key order; no generated identifiers.
  - All source values, nulls, rows, identifier variants, prose amounts, questions,
    answer files, validators, and hint body retained during the original migration.
  - Subsequent user-approved clarifications updated context/hints.md and corresponding
    descriptions in context/description.md; data, questions, and reference answers
    remain unchanged.
  - Subsequent validator fixes accept sentence-final punctuation after integer answers
    and distinguish declared or bold agency answers from unrelated bold headings.
  - SQLite INTEGER preserved as int64 and DuckDB INTEGER as int32. No normalization,
    joins, amount inference or grading changes.
  export_environment:
    python: 3.12.8
    pymongo: 4.16.0
    duckdb: 1.4.2
