  shared_files: []
  adaptations:
  - TEXT-only PostgreSQL INSERT snapshot decoded with standard_conforming_strings=on,
    literal backslashes preserved, PRIMARY KEY recorded and checked; no SQL execution/server
    restore.
  - BSON descriptions and references encoded as reversible JSON arrays, preserving
    order, empty lists and repeated references. Actual lang key retained; no generated
    identifiers.
  - All source values, nulls, rows, identifier variants, scores and versions as text,
    questions, answer files, validators, and hint body retained.
  - SQLite INTEGER preserved as int64 and DuckDB INTEGER as int32. No normalization,
    joins, severity inference or grading changes.
  sql_string_interpretation:
    standard_conforming_strings: 'on'
    server_setting_verified: false
    reference: https://www.postgresql.org/docs/current/runtime-config-compatible.html#GUC-STANDARD-CONFORMING-STRINGS
