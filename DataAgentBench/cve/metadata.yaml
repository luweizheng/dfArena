dataset_id: cve
version: '1.0'
domain: software
source:
  benchmark: DataAgentBench
  dataset: query_cve
  adaptations:
  - TEXT-only PostgreSQL INSERT data was decoded without SQL execution or server restore using standard_conforming_strings=on,
    preserving literal backslashes; the original server setting was not independently verified.
  - cve_documents.descriptions and references are reversible JSON array strings. Array order, empty arrays,
    repeated references, object key order, and original lang/url/source keys were retained; no _id was
    generated.
  - Rows, duplicate/conflicting records, nulls, empty strings, identifier variants, flags, scores-as-text,
    and version encodings were retained without inference or normalization. SQLite INTEGER remains int64
    and DuckDB INTEGER remains int32.
  - The source primary key kev_vendor_aliases.vendor_project was checked for uniqueness and non-null values
    during conversion; Parquet does not enforce that constraint.
