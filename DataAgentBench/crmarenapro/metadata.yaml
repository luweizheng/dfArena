  adaptations:
  - All rows, duplicates, nulls, strings, trailing whitespace, noisy identifiers,
    HTML, questions, answers, validators and hint body retained.
  - SQLite/DuckDB native types retained. Amount and NumberOfEmployees remain float64;
    fields stored as text stay text even when numeric/date-like.
  - PostgreSQL TEXT INSERT snapshot parsed without execution using standard_conforming_strings=on.
    Unquoted SQL identifiers fold to lowercase; quoted Case retains case. Original
    SQL identifier spellings recorded.
  - No cleaning, joins, date parsing, amount calculation, business-policy interpretation,
    answer computation or grading changes.
