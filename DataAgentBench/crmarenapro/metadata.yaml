dataset_id: crmarenapro
version: '1.0'
domain: business
source:
  benchmark: DataAgentBench
  dataset: query_crmarenapro
  adaptations:
  - 'SQLite, DuckDB, and PostgreSQL TEXT INSERT inputs were converted without cleaning or joins; rows,
    duplicates, nulls, empty strings, leading # characters, trailing whitespace, HTML, and multiline text
    were retained.'
  - Native numeric types were retained, including float64 Amount and NumberOfEmployees. Numeric-looking
    and date-looking text was not parsed.
  - The PostgreSQL snapshot was decoded without SQL execution using standard_conforming_strings=on, preserving
    literal backslashes; the original server setting was not independently verified.
  - Unquoted PostgreSQL identifiers fold to lowercase; the quoted Case table retains its capital C. This
    changes identifier interpretation, not the case of cell values.
