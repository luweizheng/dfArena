dataset_id: yelp
version: '1.0'
domain: business
source:
  benchmark: DataAgentBench
  dataset: query_yelp
  adaptations:
  - BSON ObjectId values use reversible 24-character lowercase hexadecimal text.
  - business.attributes and hours use JSON object text, preserving object-key order and original string
    values. Source null remains Parquet null; absent keys remain absent; empty objects remain {}. Values
    were not evaluated as code or converted to booleans.
  - Each check-in date remains its original string rather than a list. Other dates remain strings; BSON
    integers retain int32 and DuckDB BIGINT retains int64.
  - Rows, repeated records, nulls, empty strings, text characters, business identifier prefixes, and references
    were retained without location/category extraction, joins, cleaning, deduplication, rating aggregation,
    or truth-value inference.
