dataset_id: krama
version: '1.0'
domain: geospatial
source:
  benchmark: DataAgentBench
  dataset: query_krama
  adaptations:
  - Document strings, embedded tables, prose, names, and newlines were retained in full; no _id or inferred
    domain/name columns were added.
  - Binary assets and GeoPackage geometry bytes were retained byte-for-byte as ordinary Parquet binary,
    without base64 encoding, extraction, decompression, GeoParquet conversion, CRS transformation, or
    file execution.
  - 'Observed SQLite storage types determined the Parquet types: SHAPE and geom are binary, while DateCurrent,
    src_date, and src_update are strings despite their NUM declarations. All-null TEXT columns remain
    nullable strings.'
  - Rows, duplicates, nulls, empty values, whitespace, and binary zero bytes were retained. Text-valued
    dates, temperatures, units, and identifiers were not parsed or normalized.
  - AppleDouble ._ filesystem sidecars were excluded from data tables; original source files were not
    deleted.
