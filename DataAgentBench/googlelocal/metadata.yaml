dataset_id: googlelocal
version: '1.0'
domain: business
source:
  benchmark: DataAgentBench
  dataset: query_googlelocal
  adaptations:
  - PostgreSQL text COPY snapshots were decoded without server restore; SQLite and DuckDB tables were
    read directly and exported to Parquet.
  - Physical types, rows, duplicates, nulls, empty strings, numeric values, column names, and text formatting
    were retained. Structured text, bracketed annotations, and date-like or number-like text were not
    parsed or replaced with nulls.
  - No joins, sample selection, aggregation, or missing-value imputation were applied during conversion.
